# O API Gateway manda tudo para o NLB do Traefik, e o Traefik escolhe o servico
# pelo prefixo. A API nao conhece /os: o middleware tira o prefixo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tirar-prefixo
  namespace: garageos-os
spec:
  stripPrefix:
    prefixes:
      - /os
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garageos-os
  namespace: garageos-os
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: garageos-os-tirar-prefixo@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /os
            pathType: Prefix
            backend:
              service:
                name: os
                port:
                  name: http
