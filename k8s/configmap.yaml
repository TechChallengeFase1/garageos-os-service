# Configuracao nao sensivel. Segredos ficam no Secret garageos-os-secret, criado no deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garageos-os-config
  namespace: garageos-os
data:
  ASPNETCORE_ENVIRONMENT: Production
  AWS_REGION: us-east-1
  Mensageria__Transporte: AmazonSqs
  Mensageria__Ambiente: producao
  Admin__Username: admin
  # Ligado para o teste de aceite, acessado por port-forward.
  Swagger__Enabled: "true"
  NEW_RELIC_APP_NAME: garageos-os
  NEW_RELIC_LABELS: "servico:os;env:producao"
