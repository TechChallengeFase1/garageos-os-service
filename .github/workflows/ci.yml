name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # O Sonar usa o historico para saber o que e codigo novo.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Code/GarageOS.slnx

      - name: Instalar o SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner --version 12.1.0

      # Precisa envolver o build. O Quality Gate reprova o job, e com ele o PR.
      - name: Iniciar a analise do Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:"TechChallengeFase1_garageos-os-service"
          /o:"techchallengefase1"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/Program.cs"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build Code/GarageOS.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test Code/GarageOS.UnitTests/GarageOS.UnitTests.csproj --configuration Release --no-build --settings Code/coverlet.runsettings --results-directory TestResults --logger trx

      - name: BDD
        run: dotnet test Code/GarageOS.OsService.Bdd/GarageOS.OsService.Bdd.csproj --configuration Release --no-build --settings Code/coverlet.runsettings --results-directory TestResults --logger trx

      - name: Integration tests
        run: dotnet test Code/GarageOS.IntegrationTests/GarageOS.IntegrationTests.csproj --configuration Release --no-build --settings Code/coverlet.runsettings --results-directory TestResults --logger trx

      - name: Enviar a analise ao Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # Junta unitarios, integracao e BDD num relatorio so, por servico.
      - name: Relatorio de cobertura
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Html;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage/
            TestResults/**/*.trx

      # Trava da meta da fase. Vem depois de publicar, para o relatorio existir mesmo se falhar.
      - name: Exigir 80% de cobertura
        run: |
          TAXA=$(grep -oP 'line-rate="\K[0-9.]+' coverage/Cobertura.xml | head -1)
          echo "Cobertura de linhas: $TAXA"
          awk -v t="$TAXA" 'BEGIN { exit (t + 0 >= 0.8) ? 0 : 1 }'

      - name: Docker build
        run: docker build -t garageos-api:${{ github.sha }} .

  # So em push na main: PR nunca chega aqui, e o Quality Gate ja passou.
  cd:
    name: CD
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    permissions:
      id-token: write
      contents: read
