name: CD

# Imagem no ECR e deploy no EKS, depois que a CI da main termina verde. Tambem roda
# a mao, em Actions > CD > Run workflow.
#
# A infra e ligada e destruida para economizar: sem o cluster, o job "Verificar"
# so avisa e o deploy e pulado, em vez de falhar a cada merge.
#
# Nada de endereco ou segredo escrito aqui: tudo vem do SSM e do Secrets Manager.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::266380777968:role/garageos-github-actions
  AMBIENTE: producao
  SERVICO: os
  # No workflow_run, github.sha e o ultimo commit da main, nao o que passou na CI.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: cd-os
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      no_ar: ${{ steps.infra.outputs.no_ar }}
    steps:
      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: cd-os-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ver se a infra esta no ar
        id: infra
        run: |
          if aws ssm get-parameter --name "/garageos/${AMBIENTE}/eks/cluster-name" >/dev/null 2>&1 \
            && aws ssm get-parameter --name "/garageos/${AMBIENTE}/services/${SERVICO}/ecr-url" >/dev/null 2>&1; then
            echo "no_ar=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_ar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Infra fora do ar: deploy pulado."
            echo "Infra fora do ar: deploy pulado." >> "$GITHUB_STEP_SUMMARY"
          fi

  imagem:
    name: Imagem
    needs: verificar
    if: needs.verificar.outputs.no_ar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: cd-os-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Entrar no ECR
        uses: aws-actions/amazon-ecr-login@v2

      # O ECR tem tags imutaveis: rodar de novo o mesmo commit reaproveita a imagem.
      - name: Build e push
        id: push
        run: |
          ECR=$(aws ssm get-parameter --name "/garageos/${AMBIENTE}/services/${SERVICO}/ecr-url" --query Parameter.Value --output text)
          IMAGE="$ECR:$COMMIT"

          if aws ecr describe-images --repository-name "${ECR#*/}" --image-ids imageTag="$COMMIT" >/dev/null 2>&1; then
            echo "Imagem do commit ja existe."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: cd-os-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      # O contrato entre os repositorios. Sem a infra de pe, falha aqui, antes de
      # tocar em qualquer coisa.
      - name: Descobrir a infraestrutura no SSM
        id: infra
        run: |
          ler() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text; }

          {
            echo "cluster=$(ler "/garageos/${AMBIENTE}/eks/cluster-name")"
            echo "namespace=$(ler "/garageos/${AMBIENTE}/eks/namespace/${SERVICO}")"
            echo "app_secret=$(ler "/garageos/app/secret-arn")"
            echo "irsa=$(ler "/garageos/${AMBIENTE}/services/${SERVICO}/irsa-role-arn")"
            echo "db_secret=$(ler "/garageos/${AMBIENTE}/services/${SERVICO}/db-secret-arn")"
            echo "auth_secret=$(ler "/garageos/${AMBIENTE}/services/${SERVICO}/rds/auth-reader-secret-arn")"
          } >> "$GITHUB_OUTPUT"

      - name: Configurar acesso ao cluster
        run: |
          aws eks update-kubeconfig --name "${{ steps.infra.outputs.cluster }}" --region "$AWS_REGION"
          kubectl get nodes

      # Os segredos nao vivem no Git. Sao lidos do Secrets Manager aqui e viram um
      # Secret do Kubernetes. O par dry-run + apply cria ou atualiza.
      - name: Criar o Secret a partir do Secrets Manager
        run: |
          segredo() { aws secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text; }

          APP_JSON=$(segredo "${{ steps.infra.outputs.app_secret }}")
          JWT=$(printf '%s' "$APP_JSON" | jq -r .jwtSecretKey)
          ISSUER=$(printf '%s' "$APP_JSON" | jq -r .jwtIssuer)
          AUDIENCE=$(printf '%s' "$APP_JSON" | jq -r .jwtAudience)
          NEWRELIC=$(printf '%s' "$APP_JSON" | jq -r '.newRelicLicenseKey // empty')

          echo "::add-mask::$JWT"
          [ -n "$NEWRELIC" ] && echo "::add-mask::$NEWRELIC"

          DB_JSON=$(segredo "${{ steps.infra.outputs.db_secret }}")
          CONN=$(printf '%s' "$DB_JSON" | jq -r .connectionString)
          echo "::add-mask::$CONN"
          ADMIN=$(printf '%s' "$APP_JSON" | jq -r .adminPassword)
          echo "::add-mask::$ADMIN"

          kubectl create secret generic garageos-os-secret \
            --namespace "${{ steps.infra.outputs.namespace }}" \
            --from-literal=Jwt__SecretKey="$JWT" \
            --from-literal=Jwt__Issuer="$ISSUER" \
            --from-literal=Jwt__Audience="$AUDIENCE" \
            --from-literal=ConnectionStrings__DefaultConnection="$CONN" \
            --from-literal=Admin__Password="$ADMIN" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEWRELIC" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Preencher os manifestos
        run: |
          sed -i \
            -e "s|__IMAGE__|${{ needs.imagem.outputs.image }}|" \
            -e "s|__IRSA_ROLE_ARN__|${{ steps.infra.outputs.irsa }}|" \
            k8s/*.yaml k8s/jobs/migrations-job.yaml
          grep -h "image:" k8s/deployment.yaml

      # Migrations antes do rollout, num Job. O delete e porque a especificacao de
      # um Job e imutavel.
      - name: Aplicar migrations
        run: |
          NS="${{ steps.infra.outputs.namespace }}"
          kubectl apply -f k8s/serviceaccount.yaml -f k8s/configmap.yaml
          kubectl delete job garageos-os-migrations -n "$NS" --ignore-not-found
          kubectl apply -f k8s/jobs/migrations-job.yaml

          if ! kubectl wait --for=condition=complete job/garageos-os-migrations -n "$NS" --timeout=300s; then
            echo "::error::As migrations falharam. Log do Job abaixo."
            kubectl logs job/garageos-os-migrations -n "$NS" --tail=50
            exit 1
          fi

          kubectl logs job/garageos-os-migrations -n "$NS" --tail=20

      # Usuario somente leitura da Lambda de login por CPF. Depende da tabela
      # Clientes, por isso vem depois das migrations. Idempotente.
      - name: Criar o usuario da Lambda
        run: |
          NS="${{ steps.infra.outputs.namespace }}"
          segredo() { aws secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text; }

          DB=$(segredo "${{ steps.infra.outputs.db_secret }}")
          AUTH=$(segredo "${{ steps.infra.outputs.auth_secret }}")
          SENHA=$(printf '%s' "$DB" | jq -r .password)
          LEITOR=$(printf '%s' "$AUTH" | jq -r .password)
          echo "::add-mask::$SENHA"
          echo "::add-mask::$LEITOR"

          kubectl create secret generic garageos-os-db-bootstrap \
            --namespace "$NS" \
            --from-literal=PGHOST="$(printf '%s' "$DB" | jq -r .host)" \
            --from-literal=PGPORT="$(printf '%s' "$DB" | jq -r .port)" \
            --from-literal=PGDATABASE="$(printf '%s' "$DB" | jq -r .dbname)" \
            --from-literal=PGUSER="$(printf '%s' "$DB" | jq -r .username)" \
            --from-literal=PGPASSWORD="$SENHA" \
            --from-literal=AUTH_READER_PASSWORD="$LEITOR" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create configmap garageos-os-db-bootstrap-sql \
            --namespace "$NS" \
            --from-file=criar-auth-reader.sql=sql/criar-auth-reader.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job garageos-os-db-bootstrap -n "$NS" --ignore-not-found
          kubectl apply -f k8s/jobs/db-bootstrap-job.yaml

          if ! kubectl wait --for=condition=complete job/garageos-os-db-bootstrap -n "$NS" --timeout=180s; then
            echo "::error::O bootstrap do banco falhou. Log do Job abaixo."
            kubectl logs job/garageos-os-db-bootstrap -n "$NS" --tail=30
            exit 1
          fi
      # O restart e para pegar segredo novo: rodar de novo o mesmo commit nao muda
      # o Deployment, e o pod seguiria com as credenciais antigas.
      - name: Aplicar e aguardar
        run: |
          NS="${{ steps.infra.outputs.namespace }}"
          kubectl apply -f k8s/
          kubectl rollout restart deployment/garageos-os -n "$NS"

          if ! kubectl rollout status deployment/garageos-os -n "$NS" --timeout=300s; then
            echo "::error::O rollout falhou. Eventos e log abaixo."
            kubectl get pods -n "$NS"
            kubectl describe pods -n "$NS" -l app=garageos-os | tail -30
            kubectl logs -n "$NS" -l app=garageos-os --tail=50 || true
            exit 1
          fi

      # Pelo mesmo caminho do trafego real: NLB, Traefik, prefixo e pod.
      - name: Smoke test
        run: |
          NLB=$(kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "http://$NLB/os/health/ready" >/dev/null; then
              echo "Saudavel pelo NLB." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/os/health/ready nao respondeu pelo NLB."
          exit 1
